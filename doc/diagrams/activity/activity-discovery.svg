her direction</text><rect fill="#F1F1F1" height="35.0938" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="181.4316" x="118.2119" y="308.9844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.4316" x="128.2119" y="331.4414">Batch-load candidate interests</text><rect fill="#F1F1F1" height="35.0938" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="280.1328" x="68.8613" y="420.9971"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="260.1328" x="78.8613" y="443.4541">Calculate compatibility through MatchingStrategy</text><rect fill="#F1F1F1" height="35.0938" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="279.4473" x="69.2041" y="484.6729"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="259.4473" x="79.2041" y="507.1299">Build safe candidate DTO with common interests</text><polygon fill="#F1F1F1" points="146.5559,364.0781,271.2996,364.0781,283.2996,376.0781,271.2996,388.0781,146.5559,388.0781,134.5559,376.0781,146.5559,364.0781" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="212.9277" y="399.4971">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="124.7437" x="146.5559" y="380.5791">More eligible candidates?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="122.3206" y="373.6611">no</text><rect fill="#F1F1F1" height="35.0938" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="246.0957" x="85.8799" y="561.7666"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="226.0957" x="95.8799" y="584.2236">Rank by compatibility and apply result limit</text><rect fill="#F1F1F1" height="35.0938" rx="3" ry="3" style="stroke:#1