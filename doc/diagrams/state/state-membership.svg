" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.4688" x="92.53" y="423.752">leftAt is set</text></g><g id="Deleted"><rect fill="#F1F1F1" height="50" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="133.6201" x="216.53" y="519.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="216.53" x2="350.1501" y1="547.2188" y2="547.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.6201" x="226.53" y="539.1426">Room soft deleted</text></g><ellipse cx="144.53" cy="54.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="283.53" cy="641.6094" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="283.53" cy="641.6094" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="21" data-uid="ent0003" id="entity_GMN2"><path d="M456.53,262.6094 L456.53,277.1094 L214.08,281.1094 L456.53,285.1094 L456.53,299.3125 A3,3 0 0 0 459.53,302.3125 L785.9714,302.3125 A3,3 0 0 0 788.9714,299.3125 L788.9714,269.6094 L778.9714,259.6094 L459.53,259.6094 A3,3 0 0 0 456.53,262.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M778.9714,259.6094 L778.9714,268.1094 A1.5,1.5 0 0 0 780.4714,269.6094 L788.9714,269.6094 L778.9714,259.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.7178" x="462.53" y="278.1045">Media presence is transient and tracked separately.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.4414" x="462.53" y="294.4561">Disconnecting media does not automatically set leftAt.</text></g><!--link *start* to Inactive--><g class="link" data-entity-1="*start*" data-entity-2="Inactive" data-source-line="12" data-uid="lnk3" id="link_*start*_Inactive"><path d="M144.53,64.6194 C