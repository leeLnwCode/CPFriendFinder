<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head>
<script th:src="@{/js/auth-session.js(v=1)}"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Home - CP Friend Finder</title>
    <link rel="stylesheet" th:href="@{/css/global-call.css}" />

    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/home.css}" />
    <link rel="stylesheet" th:href="@{/css/friend-profile-popup.css}" />
    <link rel="stylesheet" th:href="@{/css/profile-popup.css(v=11)}" />
  <link rel="stylesheet" th:href="@{/css/ui-refresh.css}"/>
<link rel="stylesheet" th:href="@{/css/call-ui.css(v=2)}"/>
  <link rel="stylesheet" href="/css/message-actions.css?v=1" />
</head>

  <body>
    <div class="page-layout">
      <!-- ================= SIDEBAR ================= -->

      <aside th:replace="~{fragments/sidebar :: sidebar('home')}"></aside>

      <div th:replace="~{fragments/profile-editor :: profileEditor}"></div>

      <!-- ================= MAIN ================= -->

      <main class="page-content home-content">
        <!-- Random Friend Banner -->

        <section class="random-banner">
          <div class="banner-content">
            <h1>ไม่รู้จะคุยกับใคร? ลองสุ่มเพื่อนดู!</h1>

            <p>เจอเพื่อนใหม่จากความสนใจที่เหมือนกัน แล้วเริ่มคุยกันได้เลย</p>

            <button class="random-button">
              เริ่มค้นหาเพื่อนเลย
              <span>▶</span>
            </button>
          </div>

          <div class="banner-decoration">✦</div>
        </section>

        <!-- Room Header -->

        <div class="room-header">
          <h2>ค้นหาห้องพูดคุย</h2>

          
        </div>

        <!-- Search + Filter -->

        <div class="room-toolbar">
          <div class="search-box">
            <span>⌕</span>

            <input
              type="text"
              id="roomSearch"
              placeholder="ค้นหาห้องที่ความสนใจ..."
            />
          </div>

          

          <select id="interestFilter" aria-label="กรองตามความสนใจ"><option value="">ทุกความสนใจ</option></select>
          <select id="yearFilter" aria-label="กรองตามชั้นปี"><option value="">ทุกชั้นปี</option><option value="1">ปี 1</option><option value="2">ปี 2</option><option value="3">ปี 3</option><option value="4">ปี 4</option><option value="5">ปี 5</option><option value="6">ปี 6</option></select>
          <select id="roomSort" aria-label="เรียงลำดับห้อง"><option value="newest">ใหม่สุด</option><option value="oldest">เก่าสุด</option><option value="name">ชื่อห้อง</option></select>

          <button
            type="button"
            id="createRoomButton"
            class="create-room-button"
          >
            + สร้างห้อง
          </button>
        </div>

        <!-- Create Room Popup -->

        <div id="createRoomModal" class="modal-overlay">
          <div class="create-room-modal">
            <h2>สร้างห้องพูดคุย</h2>

            <label>ชื่อห้อง</label>

            <input
              type="text"
              id="roomName" maxlength="100"
              placeholder="เช่น หาเพื่อนนั่งทำโปรเจค..."
            />

            <label>คำอธิบายเพิ่มเติม</label>

            <input
              type="text"
              id="roomDescription" maxlength="500"
              placeholder="เช่น ปั่นโปรเจค/การบ้านด้วยกัน..."
            />

            <div class="form-row">
              <!-- ความสนใจ -->
              <div>
                <label>ความสนใจ</label>

                <details class="multi-select" id="roomInterest">
                  <summary class="multi-select-display">
                    <span id="selectedInterestText"> เลือกความสนใจ </span>

                    <span class="dropdown-arrow"> ▼ </span>
                  </summary>

                  <div class="multi-select-options"><p role="status">กำลังโหลดความสนใจ...</p></div>
                </details>
              </div>

              <!-- ชั้นปี -->
              <div>
                <label>ชั้นปี</label>

                <details class="multi-select" id="roomYearSelect">
                  <summary class="multi-select-display">
                    <span id="selectedYearText">ปี 1</span>
                    <span class="dropdown-arrow">▼</span>
                  </summary>

                  <div class="multi-select-options year-options">
                    <label>
                      <input type="checkbox" name="roomYear" value="all" />
                      ทุกชั้นปี
                    </label>

                    <label>
                      <input
                        type="checkbox"
                        name="roomYear"
                        value="1"
                        checked
                      />
                      ปี 1
                    </label>

                    <label>
                      <input type="checkbox" name="roomYear" value="2" />
                      ปี 2
                    </label>

                    <label>
                      <input type="checkbox" name="roomYear" value="3" />
                      ปี 3
                    </label>

                    <label>
                      <input type="checkbox" name="roomYear" value="4" />
                      ปี 4
                    </label>

                    <label>
                      <input type="checkbox" name="roomYear" value="5" />
                      ปีลึก
                    </label>
                  </div>
                </details>
              </div>
            </div>

            <div class="form-row">
              <div>
                <label>จำนวนคนสูงสุด</label>

                <input type="number" id="roomMax" value="10" min="2" max="10" />
              </div>

              <div>
                <label>ประเภทห้อง</label>

                <select id="roomType">
                  <option value="Public">Public</option>
                  <option value="Private">Private</option>
                </select>
              </div>
            </div>

            <div class="modal-buttons">
              <button type="button" id="cancelCreateRoom">ยกเลิก</button>

              <button type="button" id="confirmCreateRoom">ยืนยัน</button>
            </div>
          </div>
        </div>

        <!-- ================= ROOM GRID ================= -->

        <section class="room-grid" id="roomGrid" aria-live="polite"><p class="friend-empty">กำลังโหลดห้องพูดคุย...</p></section>
      </main>
    </div>

    <!-- PRIVATE ROOM CODE POPUP  -->

    <div id="privateRoomModal" class="modal-overlay">
      <div class="private-room-modal">
        <h2>เข้าห้อง Private</h2>

        <p id="privateRoomName">กรุณากรอกรหัสเพื่อเข้าห้อง</p>

        <input
          type="text"
          id="privateRoomCode"
          placeholder="กรอกรหัสเข้าห้อง"
          maxlength="100"
        />

        <p id="privateRoomError"></p>

        <div class="modal-buttons">
          <button type="button" id="cancelPrivateRoom">ยกเลิก</button>

          <button type="button" id="confirmPrivateRoom">เข้าห้อง</button>
        </div>
      </div>
    </div>

    <div
      th:replace="~{fragments/friend-profile-popup :: friendProfilePopup}"
    ></div>

    <script th:src="@{/js/friend-profile-popup.js(v=20)}"></script>
    <script th:src="@{/js/home.js(v=9)}"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/profile-popup.js(v=11)}"></script>
<div th:replace="~{fragments/global-call :: globalCall}"></div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script th:src="@{/js/call.js(v=11)}"></script>
<script th:src="@{/js/global-call.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/room-live.js(v=1)}"></script>
</body>
</html>
