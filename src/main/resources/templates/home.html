<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Home - CP Friend Finder</title>

    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/home.css}" />
    <link rel="stylesheet" th:href="@{/css/friend-profile-popup.css}" />
    <link rel="stylesheet" th:href="@{/css/profile-popup.css}" />
  </head>

  <body>
    <div class="page-layout">
      <!-- ================= SIDEBAR ================= -->

      <aside class="sidebar">
        <!-- Logo -->
        <div class="sidebar-logo">
          <img th:src="@{/images/Full_logo.png}" alt="CP Friend Finder" />
        </div>

        <!-- Profile -->
        <div class="sidebar-profile" id="sidebarProfileButton">
          <img
            id="sidebarProfileImage"
            th:src="@{/images/man.jpg}"
            alt="Profile"
            class="profile-image"
          />

          <div class="profile-info">
            <div id="sidebarProfileName" class="profile-name">กำลังโหลด...</div>

            <div id="sidebarProfileYear" class="profile-year"></div>

            <div id="sidebarProfileDepartment" class="profile-department"></div>
          </div>

          <button class="profile-arrow">⌄</button>
        </div>

        <!-- Navigation -->
        <nav class="sidebar-menu">
          <a href="/home" class="menu-item active">
            <span class="menu-icon">⌂</span>
            <span>หน้าหลัก</span>
          </a>

          <a href="/friend" class="menu-item">
            <span class="menu-icon">☺︎</span>
            <span>เพื่อนของฉัน</span>
          </a>

          <a href="/notification" class="menu-item">
            <span class="menu-icon">☏</span>
            <span>การแจ้งเตือน</span>
            <span id="notificationBadge" class="notification-badge"></span>
          </a>

          <a href="/setting" class="menu-item">
            <span class="menu-icon">⚙</span>
            <span>การตั้งค่า</span>
          </a>
        </nav>
      </aside>

      <div class="profile-modal" id="profileModal">
        <div class="profile-modal-overlay" id="profileModalOverlay"></div>

        <div class="profile-modal-content">
          <div class="profile-modal-header">
            <h2>แก้ไขโปรไฟล์</h2>

            <button
              type="button"
              class="profile-modal-close"
              id="closeProfileModal"
            >
              ×
            </button>
          </div>

          <div class="profile-edit-form">
            <!-- รูปโปรไฟล์ -->
            <div class="profile-image-edit">
              <img
                id="editProfileImage"
                th:src="@{/images/man.jpg}"
                alt="Profile"
              />

              <button
                type="button"
                class="change-image-button"
                id="changeProfileImage"
              >
                เปลี่ยนรูป
              </button>

              <input
                type="file"
                id="profileImageInput"
                accept="image/*"
                hidden
              />
            </div>

            <!-- ชื่อ -->
            <div class="profile-field">
              <label for="editFirstname">ชื่อ</label>
              <input type="text" id="editFirstname" placeholder="กรอกชื่อ" />
            </div>

            <!-- นามสกุล -->
            <div class="profile-field">
              <label for="editLastname">นามสกุล</label>
              <input type="text" id="editLastname" placeholder="กรอกนามสกุล" />
            </div>

            <!-- Bio -->
            <div class="profile-field">
              <label for="editBio">เกี่ยวกับฉัน</label>
              <textarea
                id="editBio"
                rows="4"
                placeholder="บอกเกี่ยวกับตัวคุณ..."
              ></textarea>
            </div>

            <div class="profile-field">
              <label for="editDateOfBirth">วันเกิด</label>
              <input type="date" id="editDateOfBirth" />
            </div>

            <!-- ปี -->
            <div class="profile-field">
              <label for="editYear">ชั้นปี</label>
              <select id="editYear">
                <option value="">เลือกชั้นปี</option>
                <option value="1">ปี 1</option>
                <option value="2">ปี 2</option>
                <option value="3">ปี 3</option>
                <option value="4">ปี 4</option>
              </select>
            </div>

            <!-- สาขา -->
            <div class="profile-field">
              <label for="editDepartment">สาขา</label>
              <input type="text" id="editDepartment" placeholder="กรอกสาขา" />
            </div>

            <!-- ปุ่ม -->
            <div class="profile-modal-actions">
              <button
                type="button"
                class="profile-cancel-button"
                id="cancelProfileEdit"
              >
                ยกเลิก
              </button>

              <button
                type="button"
                class="profile-save-button"
                id="saveProfileEdit"
              >
                บันทึก
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= MAIN ================= -->

      <main class="page-content home-content">
        <!-- Room Header -->

        <div class="room-header">
          <h2>ห้องที่กำลังคุย</h2>
        </div>

        <!-- Search + Filter -->

        <div class="room-toolbar">
          <div class="search-box">
            <span>⌕</span>

            <input
              type="text"
              id="roomSearch"
              placeholder="ค้นหาห้องที่ความสนใจ..."
            />
          </div>

          <select id="yearFilter">
            <option value="">ทุกปี</option>
            <option value="1">ปี 1</option>
            <option value="2">ปี 2</option>
            <option value="3">ปี 3</option>
            <option value="4">ปี 4</option>
            <option value="other">ปีลึก</option>
          </select>

          <select id="interestFilter">
            <option value="">ทุกความสนใจ</option>
            <option value="Gaming">Gaming</option>
            <option value="ROV">ROV</option>
            <option value="Minecraft">Minecraft</option>
            <option value="Valorant">Valorant</option>
            <option value="Programming">Programming</option>
            <option value="Project">Project</option>
            <option value="Hackathon">Hackathon</option>
            <option value="Anime">Anime</option>
            <option value="Book">Book</option>
            <option value="Calculus1">Calculus 1</option>
          </select>

          <button
            type="button"
            id="createRoomButton"
            class="create-room-button"
          >
            + สร้างห้อง
          </button>
        </div>

        <!-- Create Room Popup -->

        <div id="createRoomModal" class="modal-overlay" aria-hidden="true">
          <section
            class="create-room-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="createRoomTitle"
          >
            <header class="create-room-modal-header">
              <div>
                <p class="create-room-eyebrow">ROOM SETTINGS</p>
                <h2 id="createRoomTitle">สร้างห้องพูดคุย</h2>
              </div>

              <button
                type="button"
                class="create-room-close"
                id="closeCreateRoom"
                aria-label="ปิดหน้าต่าง"
              >
                ×
              </button>
            </header>

            <form id="createRoomForm" novalidate>
              <div class="create-room-field">
                <label for="roomName">ชื่อห้อง</label>
                <input
                  type="text"
                  id="roomName"
                  maxlength="100"
                  placeholder="เช่น หาเพื่อนนั่งทำโปรเจค..."
                  required
                />
              </div>

              <div class="create-room-field">
                <label for="roomDescription">คำอธิบายเพิ่มเติม</label>
                <textarea
                  id="roomDescription"
                  rows="3"
                  maxlength="500"
                  placeholder="เล่าให้เพื่อนรู้ว่าห้องนี้คุยเรื่องอะไร"
                ></textarea>
              </div>

              <div class="form-row">
                <div class="create-room-field">
                  <label for="roomYear">ชั้นปีเป้าหมาย</label>
                  <select id="roomYear">
                    <option value="">ทุกชั้นปี</option>
                    <option value="1">ปี 1</option>
                    <option value="2">ปี 2</option>
                    <option value="3">ปี 3</option>
                    <option value="4">ปี 4</option>
                    <option value="5">ปีลึก</option>
                  </select>
                </div>

                <div class="create-room-field">
                  <label for="roomMax">จำนวนคนสูงสุด</label>
                  <input
                    type="number"
                    id="roomMax"
                    value="10"
                    min="2"
                    max="10"
                    required
                  />
                </div>
              </div>

              <div class="create-room-field">
                <label>ความสนใจ</label>
                <div
                  id="roomInterestOptions"
                  class="create-room-interests"
                  aria-label="เลือกความสนใจของห้อง"
                >
                  <p class="create-room-interest-empty">กำลังโหลดความสนใจ...</p>
                </div>
              </div>

              <div class="form-row">
                <div class="create-room-field">
                  <label for="roomType">ประเภทห้อง</label>
                  <select id="roomType">
                    <option value="Public">Public</option>
                    <option value="Private">Private</option>
                  </select>
                </div>

                <div
                  class="create-room-field create-room-password"
                  id="roomPasswordField"
                  hidden
                >
                  <label for="roomPassword">รหัสเข้าห้อง</label>
                  <input
                    type="password"
                    id="roomPassword"
                    minlength="4"
                    maxlength="100"
                    autocomplete="new-password"
                    placeholder="อย่างน้อย 4 ตัวอักษร"
                  />
                </div>
              </div>

              <p
                class="create-room-error"
                id="createRoomError"
                role="alert"
                hidden
              ></p>

              <div class="modal-buttons">
                <button type="button" id="cancelCreateRoom">ยกเลิก</button>
                <button type="submit" id="confirmCreateRoom">สร้างห้อง</button>
              </div>
            </form>
          </section>
        </div>

        <!-- ================= ROOM GRID ================= -->

        <section class="room-grid" id="roomGrid"></section>
      </main>
    </div>

    <!-- PRIVATE ROOM CODE POPUP  -->

    <div id="privateRoomModal" class="modal-overlay">
      <div class="private-room-modal">
        <h2>เข้าห้อง Private</h2>

        <p id="privateRoomName">กรุณากรอกรหัสเพื่อเข้าห้อง</p>

        <input
          type="text"
          id="privateRoomCode"
          placeholder="กรอกรหัสเข้าห้อง"
          maxlength="6"
        />

        <p id="privateRoomError"></p>

        <div class="modal-buttons">
          <button type="button" id="cancelPrivateRoom">ยกเลิก</button>

          <button type="button" id="confirmPrivateRoom">เข้าห้อง</button>
        </div>
      </div>
    </div>

    <div
      th:replace="~{fragments/friend-profile-popup :: friendProfilePopup}"
    ></div>

    <script th:src="@{/js/friend-profile-popup.js}"></script>
    <script th:src="@{/js/home.js(v=3)}"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/sidebar.js}"></script>
    <script th:src="@{/js/profile-popup.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
