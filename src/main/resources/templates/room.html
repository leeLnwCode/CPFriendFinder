<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Room - CP Friend Finder</title>
  <link rel="stylesheet" th:href="@{/css/room.css}" />
  <link rel="stylesheet" th:href="@{/css/theme.css}" />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
  <link rel="stylesheet" th:href="@{/css/friend-profile-popup.css}" />
  <link rel="stylesheet" th:href="@{/css/profile-popup.css}" />
</head>

<body>
  <body>

  <!-- Friend Profile Popup -->
  <div th:replace="~{fragments/friend-profile-popup :: friendProfilePopup}"></div>

  <div class="room-page">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">
      <!-- Logo -->
      <div class="sidebar-logo">
        <img th:src="@{/images/Full_logo.png}" alt="CP Friend Finder" />
      </div>

      <!-- Profile -->
      <div class="sidebar-profile" id="sidebarProfileButton">
          <img
            id="sidebarProfileImage"
            th:src="@{/images/man.jpg}"
            alt="Profile"
            class="profile-image"
          />

          <div class="profile-info">
            <div id="sidebarProfileName" class="profile-name">กำลังโหลด...</div>

            <div id="sidebarProfileYear" class="profile-year"></div>

            <div id="sidebarProfileDepartment" class="profile-department"></div>
          </div>

          <button class="profile-arrow">⌄</button>
        </div>

      <!-- Navigation -->
      <nav class="sidebar-menu">
        <a href="/home" class="menu-item">
          <span class="menu-icon">⌂</span>
          <span>หน้าหลัก</span>
        </a>

        <a href="/friend" class="menu-item">
          <span class="menu-icon">☺︎</span>
          <span>เพื่อนของฉัน</span>
        </a>

        <a href="/notification" class="menu-item">
          <span class="menu-icon">☏</span>
          <span>การแจ้งเตือน</span>
        </a>

        <a href="/setting" class="menu-item">
          <span class="menu-icon">⚙</span>
          <span>การตั้งค่า</span>
        </a>
      </nav>
    </aside>

    <div class="profile-modal" id="profileModal">
        <div class="profile-modal-overlay" id="profileModalOverlay"></div>

        <div class="profile-modal-content">
          <div class="profile-modal-header">
            <h2>แก้ไขโปรไฟล์</h2>

            <button
              type="button"
              class="profile-modal-close"
              id="closeProfileModal"
            >
              ×
            </button>
          </div>

          <div class="profile-edit-form">
            <!-- รูปโปรไฟล์ -->
            <div class="profile-image-edit">
              <img
                id="editProfileImage"
                th:src="@{/images/man.jpg}"
                alt="Profile"
              />

              <button
                type="button"
                class="change-image-button"
                id="changeProfileImage"
              >
                เปลี่ยนรูป
              </button>

              <input
                type="file"
                id="profileImageInput"
                accept="image/*"
                hidden
              />
            </div>

            <!-- ชื่อ -->
            <div class="profile-field">
              <label for="editFirstname">ชื่อ</label>
              <input type="text" id="editFirstname" placeholder="กรอกชื่อ" />
            </div>

            <!-- นามสกุล -->
            <div class="profile-field">
              <label for="editLastname">นามสกุล</label>
              <input type="text" id="editLastname" placeholder="กรอกนามสกุล" />
            </div>

            <!-- Bio -->
            <div class="profile-field">
              <label for="editBio">เกี่ยวกับฉัน</label>
              <textarea
                id="editBio"
                rows="4"
                placeholder="บอกเกี่ยวกับตัวคุณ..."
              ></textarea>
            </div>

            <div class="profile-field">
              <label for="editDateOfBirth">วันเกิด</label>
              <input type="date" id="editDateOfBirth" />
            </div>

            <!-- ปี -->
            <div class="profile-field">
              <label for="editYear">ชั้นปี</label>
              <select id="editYear">
                <option value="">เลือกชั้นปี</option>
                <option value="1">ปี 1</option>
                <option value="2">ปี 2</option>
                <option value="3">ปี 3</option>
                <option value="4">ปี 4</option>
              </select>
            </div>

            <!-- สาขา -->
            <div class="profile-field">
              <label for="editDepartment">สาขา</label>
              <input type="text" id="editDepartment" placeholder="กรอกสาขา" />
            </div>

            <!-- ปุ่ม -->
            <div class="profile-modal-actions">
              <button
                type="button"
                class="profile-cancel-button"
                id="cancelProfileEdit"
              >
                ยกเลิก
              </button>

              <button
                type="button"
                class="profile-save-button"
                id="saveProfileEdit"
              >
                บันทึก
              </button>
            </div>
          </div>
        </div>
      </div>

    <!-- ================= ROOM ================= -->

    <main class="room-content">
      <!-- Room Header -->

      <header class="room-header">
        <div>
          <h1 id="roomTitle">ห้องพูดคุย</h1>

          <div id="ownerRoomCode" class="owner-room-code">
            <span>รหัสเข้าห้อง</span>
            <strong id="roomCode">-</strong>
          </div>

          <p id="roomMembers">0/10 คนกำลังคุย</p>
        </div>

        <button type="button" class="leave-room-button" id="leaveRoomButton">
          ออกจากห้อง
        </button>
      </header>

      <!-- ================= ROOM MEMBERS ================= -->

      <section class="members-section">
        <div class="members-grid" id="membersGrid"></div>
      </section>
    </main>

    <!-- ================= CHAT ================= -->

    <aside class="chat-panel">
      <!-- Chat Header -->
      <div class="chat-header">
        <div class="chat-header-left">
          <svg class="chat-header-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.6 0-3.1-.44-4.38-1.2L3 20l1.2-5.12A8.5 8.5 0 1 1 21 11.5Z"/>
          </svg>
          <h2>แชท</h2>
        </div>
        <div class="chat-header-right">
          <div class="chat-members-badge">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="7" r="3.5"/>
              <path d="M15.5 7a3.5 3.5 0 1 1 0 .001"/>
              <path d="M2 20c0-3.31 3.13-6 7-6"/>
              <path d="M22 20c0-3.31-3.13-6-7-6"/>
            </svg>
            <span id="chatMembers">0 คน</span>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty-state" id="chatEmptyState">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.6 0-3.1-.44-4.38-1.2L3 20l1.2-5.12A8.5 8.5 0 1 1 21 11.5Z"/>
          </svg>
          <p>ยังไม่มีข้อความ<br/><span>เริ่มต้นสนทนากันเลย!</span></p>
        </div>
      </div>

      <!-- Chat Input -->
      <div class="chat-input-area">
        <button type="button" class="chat-icon-btn" id="imageButton" title="ส่งรูปภาพ">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
        </button>
        <input type="file" id="imageInput" accept="image/*" hidden />

        <div class="chat-input-wrapper">
          <input type="text" id="chatInput" placeholder="พิมพ์ข้อความ..." autocomplete="off" />
        </div>

        <button type="button" class="chat-send" id="sendMessageButton" title="ส่งข้อความ">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2 11 13"/>
            <path d="M22 2 15 22 11 13 2 9l20-7z"/>
          </svg>
        </button>
      </div>
    </aside>

    <div class="room-call-status" id="roomCallStatus" role="status" aria-live="polite"></div>

    <div class="room-call-toolbar" role="toolbar" aria-label="การควบคุมห้อง">
      <button
        type="button"
        class="room-call-button"
        id="roomCameraButton"
        aria-label="เปิดกล้อง"
        aria-pressed="false"
        title="เปิดกล้อง"
      >
        <svg class="control-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="6" width="13" height="12" rx="2.5" />
          <path d="M15.5 10.5 21.5 7v10l-6-3.5" />
        </svg>
      </button>
      <button
        type="button"
        class="room-call-button"
        id="roomMicrophoneButton"
        aria-label="เปิดไมค์"
        aria-pressed="false"
        title="เปิดไมค์"
      >
        <svg class="control-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2.5" width="6" height="11.5" rx="3" />
          <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" />
          <path d="M12 18v3.5" />
        </svg>
      </button>
      <button
        type="button"
        class="room-call-button"
        id="roomChatButton"
        aria-label="ปิดแชทด้านข้าง"
        aria-pressed="true"
        title="ปิดแชทด้านข้าง"
      >
        <svg class="control-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.6 0-3.1-.44-4.38-1.2L3 20l1.2-5.12A8.5 8.5 0 1 1 21 11.5Z" />
        </svg>
      </button>
      <button
        type="button"
        class="room-call-button"
        id="roomScreenShareButton"
        aria-label="แชร์หน้าจอ"
        aria-pressed="false"
        title="แชร์หน้าจอ"
      >
        <svg class="control-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="4" width="19" height="12.5" rx="2" />
          <path d="M8.5 20.5h7" />
          <path d="M12 12.5V8" />
          <path d="M9.5 10 12 7.5 14.5 10" />
        </svg>
      </button>
    </div>
  </div>


  <script th:src="@{/js/friend-profile-popup.js}"></script>
  <script th:src="@{/js/theme.js}"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
  <script th:src="@{/js/call.js(v=14)}"></script>
  <script th:src="@{/js/room.js(v=14)}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
  <script th:src="@{/js/profile-popup.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
