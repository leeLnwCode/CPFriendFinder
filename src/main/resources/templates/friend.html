<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>เพื่อน | CP Friend Finder</title>

    <!-- Global -->
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/friend-profile-popup.css}" />
    <link rel="stylesheet" th:href="@{/css/profile-popup.css}" />
    <link rel="stylesheet" th:href="@{/css/video-call.css}">

    <!-- Page -->
    <link rel="stylesheet" th:href="@{/css/friend.css}" />
  </head>

  <body>
    <div class="page-layout">
      <!-- ================= SIDEBAR ================= -->

      <aside class="sidebar">
        <!-- Logo -->
        <div class="sidebar-logo">
          <img th:src="@{/images/Full_logo.png}" alt="CP Friend Finder" />
        </div>

        <!-- Profile -->
        <div class="sidebar-profile" id="sidebarProfileButton">
          <img
            id="sidebarProfileImage"
            th:src="@{/images/man.jpg}"
            alt="Profile"
            class="profile-image"
          />

          <div class="profile-info">
            <div id="sidebarProfileName" class="profile-name">กำลังโหลด...</div>

            <div id="sidebarProfileYear" class="profile-year"></div>

            <div id="sidebarProfileDepartment" class="profile-department"></div>
          </div>

          <button class="profile-arrow">⌄</button>
        </div>

        <!-- Navigation -->
        <nav class="sidebar-menu">
          <a href="/home" class="menu-item">
            <span class="menu-icon">⌂</span>
            <span>หน้าหลัก</span>
          </a>

          <a href="/random" class="menu-item">
            <span class="menu-icon">✌︎</span>
            <span>สุ่มคุย</span>
          </a>

          <a href="/friend" class="menu-item active">
            <span class="menu-icon">☺︎</span>
            <span>เพื่อนของฉัน</span>
          </a>

          <a href="/notification" class="menu-item">
            <span class="menu-icon">☏</span>
            <span>การแจ้งเตือน</span>
          </a>

          <a href="/setting" class="menu-item">
            <span class="menu-icon">⚙</span>
            <span>การตั้งค่า</span>
          </a>
        </nav>
      </aside>

      <div class="profile-modal" id="profileModal">
        <div class="profile-modal-overlay" id="profileModalOverlay"></div>

        <div class="profile-modal-content">
          <div class="profile-modal-header">
            <h2>แก้ไขโปรไฟล์</h2>

            <button
              type="button"
              class="profile-modal-close"
              id="closeProfileModal"
            >
              ×
            </button>
          </div>

          <div class="profile-edit-form">
            <!-- รูปโปรไฟล์ -->
            <div class="profile-image-edit">
              <img
                id="editProfileImage"
                th:src="@{/images/man.jpg}"
                alt="Profile"
              />

              <button
                type="button"
                class="change-image-button"
                id="changeProfileImage"
              >
                เปลี่ยนรูป
              </button>

              <input
                type="file"
                id="profileImageInput"
                accept="image/*"
                hidden
              />
            </div>

            <!-- ชื่อ -->
            <div class="profile-field">
              <label for="editFirstname">ชื่อ</label>
              <input type="text" id="editFirstname" placeholder="กรอกชื่อ" />
            </div>

            <!-- นามสกุล -->
            <div class="profile-field">
              <label for="editLastname">นามสกุล</label>
              <input type="text" id="editLastname" placeholder="กรอกนามสกุล" />
            </div>

            <!-- Bio -->
            <div class="profile-field">
              <label for="editBio">เกี่ยวกับฉัน</label>
              <textarea
                id="editBio"
                rows="4"
                placeholder="บอกเกี่ยวกับตัวคุณ..."
              ></textarea>
            </div>

            <div class="profile-field">
              <label for="editDateOfBirth">วันเกิด</label>
              <input type="date" id="editDateOfBirth" />
            </div>

            <!-- ปี -->
            <div class="profile-field">
              <label for="editYear">ชั้นปี</label>
              <select id="editYear">
                <option value="">เลือกชั้นปี</option>
                <option value="1">ปี 1</option>
                <option value="2">ปี 2</option>
                <option value="3">ปี 3</option>
                <option value="4">ปี 4</option>
              </select>
            </div>

            <!-- สาขา -->
            <div class="profile-field">
              <label for="editDepartment">สาขา</label>
              <input type="text" id="editDepartment" placeholder="กรอกสาขา" />
            </div>

            <!-- ปุ่ม -->
            <div class="profile-modal-actions">
              <button
                type="button"
                class="profile-cancel-button"
                id="cancelProfileEdit"
              >
                ยกเลิก
              </button>

              <button
                type="button"
                class="profile-save-button"
                id="saveProfileEdit"
              >
                บันทึก
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->
      <main class="page-content friend-content">
        <div class="friend-page">
          <!-- =================================================
                 FRIEND LIST
            ================================================== -->
          <section class="friend-list-section">
            <div class="friend-list-header">
              <h1>เพื่อน</h1>
            </div>

            <!-- Search -->
            <div class="friend-search">
              <span class="search-icon">⌕</span>

              <input
                type="text"
                id="friendSearch"
                placeholder="ค้นชื่อเพื่อน..."
                autocomplete="off"
              />
            </div>

            <!-- Friend List -->
            <div class="friend-list" id="friendList"></div>
          </section>

          <!-- =================================================
                 CHAT
            ================================================== -->
          <section class="chat-section">
            <div class="chat-container">
              <!-- ================= CHAT HEADER ================= -->
              <header class="chat-header">
                <div
                  class="chat-user friend-chat-profile-trigger"
                  id="chatUserProfile"
                  data-profile
                >
                  <img
                    id="chatUserImage"
                    src="/images/man2.jpg"
                    alt="Profile"
                    class="chat-user-avatar"
                  />

                  <div class="chat-user-info">
                    <div id="chatUserName" class="chat-user-name">
                      Prashant Kumar Singh
                    </div>

                    <div id="chatUserYear" class="chat-user-year">
                      ปี 3 CS-VIP
                    </div>
                  </div>
                </div>

                <!-- ================= CHAT ACTIONS ================= -->
                <div class="chat-actions">
                  <!-- โทรเสียง -->
                  <button
                    type="button"
                    id="voiceCallButton"
                    class="chat-icon-button"
                    title="โทรเสียง"
                  >
                    <img
                      src="/images/phone-call.png"
                      alt="โทรเสียง"
                      class="theme-icon"
                    />
                  </button>

                  <!-- วิดีโอคอล -->
                  <button
                    type="button"
                    id="videoCallButton"
                    class="chat-icon-button"
                    title="วิดีโอคอล"
                  >
                    <img
                      src="/images/cam-recorder.png"
                      alt="วิดีโอคอล"
                      class="theme-icon"
                    />
                  </button>

                  <!-- More -->
                  <div class="chat-more">
                    <button
                      type="button"
                      id="chatMoreButton"
                      class="chat-icon-button"
                      title="เพิ่มเติม"
                    >
                      <img
                        src="/images/dots.png"
                        alt="เพิ่มเติม"
                        class="theme-icon"
                      />
                    </button>

                    <div id="chatMoreMenu" class="chat-more-menu">
                      <button type="button" id="unfriendButton">
                        เลิกเป็นเพื่อน
                      </button>
                    </div>
                  </div>
                </div>
              </header>

              <!-- ================= MESSAGES ================= -->
              <div class="chat-messages" id="chatMessages">
                <!-- จะถูกสร้างจาก friend.js -->
              </div>

              <!-- ================= CHAT INPUT ================= -->
              <form id="messageForm" class="chat-input-area">
                <!-- เลือกรูป -->
                <button
                  type="button"
                  id="imageButton"
                  class="image-button"
                  title="ส่งรูป"
                >
                  <img
                    src="/images/image.png"
                    alt="ส่งรูป"
                    class="theme-icon"
                  />
                </button>

                <!-- input file ซ่อนไว้ -->
                <input type="file" id="imageInput" accept="image/*" hidden />

                <!-- ข้อความ -->
                <input
                  type="text"
                  id="messageInput"
                  placeholder="พิมพ์ข้อความ..."
                  autocomplete="off"
                />

                <!-- ส่ง -->
                <button type="submit" class="send-button">ส่ง</button>
              </form>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- ================= VOICE CALL POPUP ================= -->

    <div id="voiceCallOverlay" class="voice-call-overlay">
      <div class="voice-call-popup">
        <!-- ปุ่มปิด -->
        <button type="button" id="voiceCallClose" class="voice-call-close">
          ×
        </button>

        <!-- รูปโปรไฟล์ -->
        <div class="voice-call-image-wrapper">
          <img
            id="voiceCallImage"
            src="/images/man2.jpg"
            alt="Profile"
            class="voice-call-image"
          />
        </div>

        <!-- ชื่อ -->
        <h2 id="voiceCallName">Prashant Kumar Singh</h2>

        <!-- สถานะ / เวลา -->
        <div id="voiceCallStatus" class="voice-call-status">กำลังโทร...</div>

        <!-- ปุ่มควบคุม -->
        <div class="voice-call-actions">
          <!-- ปิดไมค์ -->
          <button type="button" id="voiceCallMute" class="voice-call-action">
            <span class="voice-call-icon">
              <img src="/images/microphone-black-shape.png" alt="ไมโครโฟน" />
              <span class="voice-call-slash"></span>
            </span>
            <span>ไมค์</span>
          </button>

          <!-- วางสาย -->
          <button type="button" id="voiceCallEnd" class="voice-call-end">
            <span class="voice-call-end-icon">
              <img src="/images/phone-call.png" alt="วางสาย" />
            </span>
            <span>วางสาย</span>
          </button>

          <!-- ลำโพง -->
          <button type="button" id="voiceCallSpeaker" class="voice-call-action">
            <span class="voice-call-icon">
              <img src="/images/volume-up.png" alt="ลำโพง" />
              <span class="voice-call-slash"></span>
            </span>
            <span>ลำโพง</span>
          </button>
        </div>

        <!-- Video Call Overlay -->
        <div id="videoCallOverlay" class="video-call-overlay">
          <div class="video-call-window">
            <!-- วิดีโอของเพื่อน -->
            <div class="remote-video">
              <div class="video-placeholder">
                <img
                  id="videoCallRemoteImage"
                  src="/image/default-profile.png"
                  alt="Friend"
                />
              </div>

              <!-- ข้อมูลเพื่อน -->
              <div class="video-call-user-info">
                <img
                  id="videoCallUserImage"
                  src="/image/default-profile.png"
                  alt="Profile"
                />

                <div>
                  <div id="videoCallUserName">ชื่อเพื่อน</div>

                  <div class="video-call-time">
                    <span class="video-call-camera-icon">▮</span>
                    <span id="videoCallDuration">00:00</span>
                  </div>
                </div>
              </div>

              <!-- ปุ่มปิด -->
              <button
                id="videoCallClose"
                class="video-call-close"
                type="button"
              >
                ×
              </button>

              <!-- กล้องของเรา -->
              <div class="local-video">
                <div class="local-video-placeholder">
                  <span>คุณ</span>
                </div>
              </div>

              <!-- ปุ่มควบคุม -->
              <div class="video-call-actions">
                <!-- ปิดไมค์ -->
                <button
                  type="button"
                  id="videoCallMute"
                  class="video-call-action"
                >
                  <span class="video-call-icon">
                    <img
                      src="/images/microphone-black-shape.png"
                      alt="ไมโครโฟน"
                    />
                    <span class="video-call-slash"></span>
                  </span>
                  <span>ไมค์</span>
                </button>

                <!-- วางสาย -->
                <button type="button" id="videoCallEnd" class="video-call-end">
                  <span class="video-call-end-icon">
                    <img src="/images/phone-call.png" alt="วางสาย" />
                  </span>
                  <span>วางสาย</span>
                </button>

                <!-- ปิดกล้อง -->
                <button
                  type="button"
                  id="videoCallCamera"
                  class="video-call-action"
                >
                  <span class="video-call-icon">
                    <img src="/images/video-camera.png" alt="กล้อง" />
                    <span class="video-call-slash"></span>
                  </span>
                  <span>กล้อง</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div
          th:replace="~{fragments/friend-profile-popup :: friendProfilePopup}"
        ></div>
      </div>
    </div>

    <script th:src="@{/js/friend-profile-popup.js}"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/friend.js}"></script>
    <script th:src="@{/js/sidebar.js}"></script>
    <script th:src="@{/js/profile-popup.js}"></script>
    <link rel="stylesheet" th:href="@{/css/video-call.css}">
  </body>
</html>
