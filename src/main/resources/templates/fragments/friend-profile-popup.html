<!-- =========================================================
     FRIEND PROFILE POPUP
========================================================= -->

<div
  th:fragment="friendProfilePopup"
  id="friendProfileOverlay"
  class="friend-profile-overlay"
  aria-hidden="true"
>
  <div
    class="friend-profile-popup"
    role="dialog"
    aria-modal="true"
    aria-labelledby="friendProfileName"
  >
    <!-- Close -->
    <button
      type="button"
      id="friendProfileClose"
      class="friend-profile-close"
      aria-label="ปิด"
    >
      ×
    </button>

    <!-- Profile Image -->
    <div class="friend-profile-image-wrapper">
      <img
        id="friendProfileImage"
        src="/images/avatar-placeholder.svg"
        alt="Profile"
        class="friend-profile-image"
      />
    </div>

    <!-- Name -->
    <h2 id="friendProfileName" class="friend-profile-name">
      กำลังโหลดโปรไฟล์...
    </h2>

    <!-- Year -->
    <div id="friendProfileYear" class="friend-profile-year"></div>

    <!-- Interests -->
    <section class="friend-profile-section">
      <div class="friend-profile-section-title">
        <span class="friend-profile-section-icon"> ♥ </span>

        <span>ความสนใจ</span>
      </div>

      <div id="friendProfileInterests" class="friend-profile-interests"></div>
    </section>

    <!-- About -->
    <section class="friend-profile-section">
      <div class="friend-profile-section-title">
        <span class="friend-profile-section-icon"> ♟ </span>

        <span>เกี่ยวกับฉัน</span>
      </div>

      <p id="friendProfileBio" class="friend-profile-bio">-</p>
    </section>

    <!-- Action -->
    <div class="friend-profile-actions">
      <button
        type="button"
        id="friendProfileAction"
        class="friend-profile-action"
      >
        <span id="friendProfileActionIcon"> 👤+ </span>

        <span id="friendProfileActionText"> เพิ่มเพื่อน </span>
      </button>
    </div>
  </div>
</div>
