<!doctype html>
<html lang="th">
  <head>
<script th:src="@{/js/auth-session.js(v=1)}"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>การแจ้งเตือน - CP Friend Finder</title>
    <link rel="stylesheet" th:href="@{/css/global-call.css}" />

    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/notification.css}" />
    <link rel="stylesheet" th:href="@{/css/friend-profile-popup.css}" />
    <link rel="stylesheet" th:href="@{/css/profile-popup.css(v=11)}" />
  <link rel="stylesheet" th:href="@{/css/ui-refresh.css}"/>
<link rel="stylesheet" th:href="@{/css/call-ui.css(v=2)}"/>
</head>

  <body>
    <div class="page-layout">
      <!-- ========================= SIDEBAR ========================== -->
      <aside th:replace="~{fragments/sidebar :: sidebar('notification')}"></aside>

      <div th:replace="~{fragments/profile-editor :: profileEditor}"></div>

      <!-- =========================  MAIN CONTENT ========================== -->

      <main class="page-content main-content">
        <!-- ========================= FRIEND REQUEST ========================== -->

        <section class="notification-section">
          <div class="section-title">
            <span class="title-icon">٩( ᐛ )( ᐖ )۶</span>
            <h1>คำขอเป็นเพื่อน</h1>
          </div>

          <div id="friendRequestList" class="friend-request-list"></div>
        </section>

        <!-- ========================= MESSAGE ========================== -->

        <section class="notification-section message-section">
          <div class="section-title">
            <span class="title-icon message-icon">✉︎</span>
            <h1>ข้อความ</h1>
          </div>

          <div class="message-list"></div>
        </section>
      </main>
    </div>

    <div id="friendProfileOverlay" class="friend-profile-overlay">
      <div class="friend-profile-popup">
        <button
          type="button"
          id="friendProfileClose"
          class="friend-profile-close"
        >
          ×
        </button>

        <img
          id="friendProfileImage"
          src="/images/avatar-placeholder.svg"
          alt="Profile"
          class="friend-profile-image"
        />

        <h2 id="friendProfileName">ชื่อเพื่อน</h2>

        <p id="friendProfileYear"></p>

        <div id="friendProfileInterests" class="friend-profile-interests"></div>

        <p id="friendProfileBio" class="friend-profile-bio"></p>

        <button
          type="button"
          id="friendProfileAction"
          class="friend-profile-action"
        >
          <span id="friendProfileActionText"> เพิ่มเพื่อน </span>
        </button>
      </div>
    </div>

    <script th:src="@{/js/friend-profile-popup.js(v=20)}"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/notification.js}"></script>
    <script th:src="@{/js/sidebar.js}"></script>
    <script th:src="@{/js/profile-popup.js(v=11)}"></script>
<div th:replace="~{fragments/global-call :: globalCall}"></div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script th:src="@{/js/call.js(v=11)}"></script>
<script th:src="@{/js/global-call.js}"></script>
  </body>
</html>
