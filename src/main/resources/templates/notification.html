<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>การแจ้งเตือน - CP Friend Finder</title>

    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/notification.css}" />
    <link rel="stylesheet" th:href="@{/css/friend-profile-popup.css}" />
    <link rel="stylesheet" th:href="@{/css/profile-popup.css}" />
  </head>

  <body>
    <div class="page-layout">
      <!-- ========================= SIDEBAR ========================== -->
      <aside class="sidebar">
        <!-- Logo -->
        <div class="sidebar-logo">
          <img src="/images/Full_logo.png" alt="CP Friend Finder" />
        </div>

        <!-- Profile -->
        <div class="sidebar-profile" id="sidebarProfileButton">
          <img
            id="sidebarProfileImage"
            th:src="@{/images/man.jpg}"
            alt="Profile"
            class="profile-image"
          />

          <div class="profile-info">
            <div id="sidebarProfileName" class="profile-name">กำลังโหลด...</div>

            <div id="sidebarProfileYear" class="profile-year"></div>

            <div id="sidebarProfileDepartment" class="profile-department"></div>
          </div>

          <button class="profile-arrow">⌄</button>
        </div>

        <!-- Menu -->
        <nav class="sidebar-menu">
          <a href="/home" class="menu-item">
            <span class="menu-icon">⌂</span>
            <span>หน้าหลัก</span>
          </a>

          <a href="/friend" class="menu-item">
            <span class="menu-icon">☺︎</span>
            <span>เพื่อนของฉัน</span>
          </a>

          <a href="/notification" class="menu-item active">
            <span class="menu-icon">☏</span>
            <span>การแจ้งเตือน</span>
          </a>

          <a href="/setting" class="menu-item">
            <span class="menu-icon">⚙</span>
            <span>การตั้งค่า</span>
          </a>
        </nav>
      </aside>

      <div class="profile-modal" id="profileModal">
        <div class="profile-modal-overlay" id="profileModalOverlay"></div>

        <div class="profile-modal-content">
          <div class="profile-modal-header">
            <h2>แก้ไขโปรไฟล์</h2>

            <button
              type="button"
              class="profile-modal-close"
              id="closeProfileModal"
            >
              ×
            </button>
          </div>

          <div class="profile-edit-form">
            <!-- รูปโปรไฟล์ -->
            <div class="profile-image-edit">
              <img
                id="editProfileImage"
                th:src="@{/images/man.jpg}"
                alt="Profile"
              />

              <button
                type="button"
                class="change-image-button"
                id="changeProfileImage"
              >
                เปลี่ยนรูป
              </button>

              <input
                type="file"
                id="profileImageInput"
                accept="image/*"
                hidden
              />
            </div>

            <!-- ชื่อ -->
            <div class="profile-field">
              <label for="editFirstname">ชื่อ</label>
              <input type="text" id="editFirstname" placeholder="กรอกชื่อ" />
            </div>

            <!-- นามสกุล -->
            <div class="profile-field">
              <label for="editLastname">นามสกุล</label>
              <input type="text" id="editLastname" placeholder="กรอกนามสกุล" />
            </div>

            <!-- Bio -->
            <div class="profile-field">
              <label for="editBio">เกี่ยวกับฉัน</label>
              <textarea
                id="editBio"
                rows="4"
                placeholder="บอกเกี่ยวกับตัวคุณ..."
              ></textarea>
            </div>

            <div class="profile-field">
              <label for="editDateOfBirth">วันเกิด</label>
              <input type="date" id="editDateOfBirth" />
            </div>

            <!-- ปี -->
            <div class="profile-field">
              <label for="editYear">ชั้นปี</label>
              <select id="editYear">
                <option value="">เลือกชั้นปี</option>
                <option value="1">ปี 1</option>
                <option value="2">ปี 2</option>
                <option value="3">ปี 3</option>
                <option value="4">ปี 4</option>
              </select>
            </div>

            <!-- สาขา -->
            <div class="profile-field">
              <label for="editDepartment">สาขา</label>
              <input type="text" id="editDepartment" placeholder="กรอกสาขา" />
            </div>

            <!-- ปุ่ม -->
            <div class="profile-modal-actions">
              <button
                type="button"
                class="profile-cancel-button"
                id="cancelProfileEdit"
              >
                ยกเลิก
              </button>

              <button
                type="button"
                class="profile-save-button"
                id="saveProfileEdit"
              >
                บันทึก
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- =========================  MAIN CONTENT ========================== -->

      <main class="page-content main-content">
        <!-- ========================= FRIEND REQUEST ========================== -->

        <section class="notification-section">
          <div class="section-title">
            <span class="title-icon">٩( ᐛ )( ᐖ )۶</span>
            <h1>คำขอเป็นเพื่อน</h1>
          </div>

          <div id="friendRequestList" class="friend-request-list"></div>
        </section>

        <!-- ========================= MESSAGE ========================== -->

        <section class="notification-section message-section">
          <div class="section-title">
            <span class="title-icon message-icon">✉︎</span>
            <h1>ข้อความ</h1>
          </div>

          <div class="message-list"></div>
        </section>
      </main>
    </div>

    <div id="friendProfileOverlay" class="friend-profile-overlay">
      <div class="friend-profile-popup">
        <button
          type="button"
          id="friendProfileClose"
          class="friend-profile-close"
        >
          ×
        </button>

        <img
          id="friendProfileImage"
          src="/images/man.jpg"
          alt="Profile"
          class="friend-profile-image"
        />

        <h2 id="friendProfileName">ชื่อเพื่อน</h2>

        <p id="friendProfileYear">ปี 1</p>

        <div id="friendProfileInterests" class="friend-profile-interests"></div>

        <p id="friendProfileBio" class="friend-profile-bio"></p>

        <button
          type="button"
          id="friendProfileAction"
          class="friend-profile-action"
        >
          <span id="friendProfileActionText"> เพิ่มเพื่อน </span>
        </button>
      </div>
    </div>

    <script th:src="@{/js/friend-profile-popup.js}"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/notification.js}"></script>
    <script th:src="@{/js/sidebar.js}"></script>
    <script th:src="@{/js/profile-popup.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  </body>
</html>
