<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>การแจ้งเตือน - CP Friend Finder</title>

  <link rel="stylesheet" th:href="@{/css/theme.css}" />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
  <link rel="stylesheet" th:href="@{/css/layout.css}" />
  <link rel="stylesheet" th:href="@{/css/notification.css}" />
  <link rel="stylesheet" th:href="@{/css/friend-profile-popup.css}" />
</head>

<body>
  <div class="page-layout">
    <!-- ========================= SIDEBAR ========================== -->
    <aside class="sidebar">
      <!-- Logo -->
      <div class="sidebar-logo">
        <img src="/images/Full_logo.png" alt="CP Friend Finder" />
      </div>

      <!-- Profile -->
      <div class="sidebar-profile">
        <img src="/images/man.jpg" alt="Profile" class="profile-image" />

        <div class="profile-info">
          <div class="profile-name">Singha Waraha</div>
          <div class="profile-year">ปี 1</div>
          <div class="profile-department">CS-VIP</div>
        </div>

        <button type="button" class="profile-arrow">⌄</button>
      </div>

      <!-- Menu -->
      <nav class="sidebar-menu">
        <a href="/home" class="menu-item">
          <span class="menu-icon">⌂</span>
          <span>หน้าหลัก</span>
        </a>

        <a href="/random" class="menu-item">
          <span class="menu-icon">✌︎</span>
          <span>สุ่มคุย</span>
        </a>

        <a href="/friend" class="menu-item">
          <span class="menu-icon">☺︎</span>
          <span>เพื่อนของฉัน</span>
        </a>

        <a href="/notification" class="menu-item active">
          <span class="menu-icon">☏</span>
          <span>การแจ้งเตือน</span>
        </a>

        <a href="/setting" class="menu-item">
          <span class="menu-icon">⚙</span>
          <span>การตั้งค่า</span>
        </a>
      </nav>
    </aside>

    <!-- =========================  MAIN CONTENT ========================== -->

    <main class="page-content main-content">
      <!-- ========================= FRIEND REQUEST ========================== -->

      <section class="notification-section">
        <div class="section-title">
          <span class="title-icon">٩( ᐛ )( ᐖ )۶</span>
          <h1>คำขอเป็นเพื่อน</h1>
        </div>

        <div id="friendRequestList" class="friend-request-list">
        </div>
      </section>

      <!-- ========================= MESSAGE ========================== -->

      <section class="notification-section message-section">
        <div class="section-title">
          <span class="title-icon message-icon">✉︎</span>
          <h1>ข้อความ</h1>
        </div>

        <div class="message-list">
          <div class="message-item">
            <div class="message-avatar">
              <img src="/images/man2.jpg" alt="Prashant Kumar Singh" />
            </div>

            <div class="message-text">
              Prashant Kumar Singh ส่งข้อความใหม่ถึงคุณ!
            </div>
          </div>

          <div class="message-item">
            <div class="message-avatar">
              <img src="/images/man2.jpg" alt="Prashant Kumar Singh" />
            </div>

            <div class="message-text">
              Prashant Kumar Singh ส่งข้อความใหม่ถึงคุณ!
            </div>
          </div>

          <div class="message-item">
            <div class="message-avatar">
              <img src="/images/man2.jpg" alt="Prashant Kumar Singh" />
            </div>

            <div class="message-text">
              Prashant Kumar Singh ส่งข้อความใหม่ถึงคุณ!
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="friendProfileOverlay" class="friend-profile-overlay">
    <div class="friend-profile-popup">

        <button type="button"
                id="friendProfileClose"
                class="friend-profile-close">
            ×
        </button>

        <img id="friendProfileImage"
             src="/images/man.jpg"
             alt="Profile"
             class="friend-profile-image">

        <h2 id="friendProfileName">ชื่อเพื่อน</h2>

        <p id="friendProfileYear">ปี 1</p>

        <div id="friendProfileInterests"
             class="friend-profile-interests">
        </div>

        <p id="friendProfileBio"
           class="friend-profile-bio">
        </p>

        <button type="button"
                id="friendProfileAction"
                class="friend-profile-action">
            <span id="friendProfileActionText">
                เพิ่มเพื่อน
            </span>
        </button>

    </div>
</div>

  <script th:src="@{/js/friend-profile-popup.js}"></script>
  <script th:src="@{/js/theme.js}"></script>
  <script th:src="@{/js/notification.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
</body>

</html>
